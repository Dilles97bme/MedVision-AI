version: "3.9"

services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: medvision-fastapi

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: medvision-streamlit

    ports:
      - "8501:8501"

    volumes:
      - .:/app

    environment:
      API_URL: http://fastapi:8000/api/v1

    depends_on:
      - fastapi

    restart: unless-stopped